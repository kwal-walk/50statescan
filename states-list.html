<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
  <script src="data.js"></script>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html">Nutrition Services in Medicaid</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="map-1115.html">§1115 Waivers</a></li>
      <li><a href="map-1915.html">§1915 Waivers</a></li>

      <li><a href="states-list.html" class="active">States List</a></li>
    </ul>
  </div>
</nav>

<div class="map-header">
  <h1>States List</h1>
  <p>Click any state to view its full waiver profile</p>
</div>

<div class="states-list-container">
  <div class="states-cols-wrap" id="states-grid"></div>
</div>

<footer class="site-footer">
  <p>Developed for a Master of Public Health capstone project &nbsp;·&nbsp;
     Data current as of Spring 2026 &nbsp;·&nbsp;
     <a href="https://github.com/kwal-walk/50statescan" target="_blank">GitHub</a>
  </p>
</footer>

<script>
const sorted = Object.entries(STATE_DATA)
  .sort((a, b) => a[1].name.localeCompare(b[1].name));

// Group states by their first letter
const groups = {};
sorted.forEach(([abbr, s]) => {
  const L = s.name[0].toUpperCase();
  if (!groups[L]) groups[L] = [];
  groups[L].push({ abbr, name: s.name });
});

// Build a flat list: letter headers interleaved with state entries
const allItems = [];
Object.keys(groups).sort().forEach(L => {
  allItems.push({ type: "letter", letter: L });
  groups[L].forEach(st => allItems.push({ type: "state", abbr: st.abbr, name: st.name }));
});

// Divide into 4 columns top-to-bottom, only breaking at letter boundaries
const target = allItems.length / 4;
const colItems = [[], [], [], []];
let ci = 0, cnt = 0;
for (const item of allItems) {
  // Start a new column when we've exceeded the target AND we're at a letter header
  if (ci < 3 && cnt >= target && item.type === "letter") { ci++; cnt = 0; }
  colItems[ci].push(item);
  cnt++;
}

// Render columns
const wrap = document.getElementById("states-grid");
colItems.forEach(col => {
  const div = document.createElement("div");
  div.className = "states-col";
  col.forEach(item => {
    if (item.type === "letter") {
      const hdr = document.createElement("div");
      hdr.className = "states-letter-hdr";
      hdr.textContent = item.letter;
      div.appendChild(hdr);
    } else {
      const a = document.createElement("a");
      a.href = `state.html?state=${item.abbr}&from=list`;
      a.textContent = item.name;
      a.className = "states-link";
      div.appendChild(a);
    }
  });
  wrap.appendChild(div);
});
</script>

</body>
</html>
