  <ul class="states-grid" id="states-grid"></ul>

<footer class="site-footer">
  <p>Developed for a Master of Public Health capstone project &nbsp;·&nbsp;
     Data current as of Spring 2026 &nbsp;·&nbsp;
     <a href="https://github.com/kwal-walk/50statescan" target="_blank">GitHub</a>
  </p>
</footer>

<script>
const sorted = Object.entries(STATE_DATA)
  .sort((a, b) => a[1].name.localeCompare(b[1].name));

const grid = document.getElementById("states-grid");
sorted.forEach(([abbr, s]) => {
  const li = document.createElement("li");
  const a  = document.createElement("a");
  a.href = `state.html?state=${abbr}&from=list`;
  a.textContent = s.name;
  li.appendChild(a);
  grid.appendChild(li);
});
</script>

</body>
