<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medicaid Nutrition Waivers — 50-State Scan</title>
  <link rel="stylesheet" href="style.css" />
  <script src="data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
</head>
<body>

<header class="site-header">
  <h1>Nutrition Services in Medicaid Waivers: A 50-State Scan</h1>
  <p>Hover over a state to see waiver details &nbsp;·&nbsp; Click a state to view the full profile</p>
</header>

<main>
  <div id="map-container">
    <svg id="map" viewBox="0 0 960 600"></svg>
  </div>

  <div id="legend">
    <div class="legend-title">Waiver Status</div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#6a51a3"></div>
      <span>Both §1115 &amp; §1915 approved</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#2171b5"></div>
      <span>§1115 waiver only</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#238b45"></div>
      <span>§1915 waiver only</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch pending-swatch"></div>
      <span>§1115 pending (with §1915 approved)</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#d9d9d9"></div>
      <span>No nutrition waiver identified</span>
    </div>
  </div>
</main>

<div id="tooltip"></div>

<script>
// ── FIPS → state abbreviation map ──────────────────────────────────────────
const FIPS = {
  "01":"AL","02":"AK","04":"AZ","05":"AR","06":"CA","08":"CO","09":"CT",
  "10":"DE","11":"DC","12":"FL","13":"GA","15":"HI","16":"ID","17":"IL",
  "18":"IN","19":"IA","20":"KS","21":"KY","22":"LA","23":"ME","24":"MD",
  "25":"MA","26":"MI","27":"MN","28":"MS","29":"MO","30":"MT","31":"NE",
  "32":"NV","33":"NH","34":"NJ","35":"NM","36":"NY","37":"NC","38":"ND",
  "39":"OH","40":"OK","41":"OR","42":"PA","44":"RI","45":"SC","46":"SD",
  "47":"TN","48":"TX","49":"UT","50":"VT","51":"VA","53":"WA","54":"WV",
  "55":"WI","56":"WY"
};

// ── Color logic ────────────────────────────────────────────────────────────
function getColor(abbr) {
  const s = STATE_DATA[abbr];
  if (!s) return "#d9d9d9";
  const has1115 = s.waiver1115.approved;
  const has1915 = s.waiver1915.approved;
  if (has1115 && has1915) return "#6a51a3";
  if (has1115)            return "#2171b5";
  if (has1915)            return "#238b45";
  return "#d9d9d9";
}

function hasPending(abbr) {
  const s = STATE_DATA[abbr];
  return s && s.waiver1115pending.pending;
}

// ── Tooltip ────────────────────────────────────────────────────────────────
const tooltip = document.getElementById("tooltip");

function fmtDates(datesStr) {
  if (!datesStr) return null;
  // Extract just expiration
  const m = datesStr.match(/Expiration:\s*([^\n]+)/);
  return m ? "Expires: " + m[1].trim() : datesStr.split("\n")[0];
}

function buildTooltip(abbr) {
  const s = STATE_DATA[abbr];
  if (!s) return `<div class="tt-name">${abbr}</div><span class="tt-none">No data</span>`;

  let html = `<div class="tt-name">${s.name}`;
  if (s.waiver1115pending.pending) html += `<span class="tt-pending-badge">PENDING</span>`;
  html += `</div>`;

  // §1115 approved
  html += `<div class="tt-section"><span class="tt-label">§1115 Waiver:</span> `;
  if (s.waiver1115.approved) {
    html += `${s.waiver1115.name || "Approved"}`;
    if (s.waiver1115.count > 1) html += ` <em>(${s.waiver1115.count} waivers)</em>`;
    const exp = fmtDates(s.waiver1115.dates);
    if (exp) html += `<br><small>${exp}</small>`;
  } else {
    html += `<span class="tt-none">None</span>`;
  }
  html += `</div>`;

  // §1115 pending
  if (s.waiver1115pending.pending) {
    html += `<div class="tt-section"><span class="tt-label">§1115 Pending:</span> `;
    html += s.waiver1115pending.name || "Pending submission";
    if (s.waiver1115pending.submitted) html += `<br><small>Submitted: ${s.waiver1115pending.submitted}</small>`;
    html += `</div>`;
  }

  // §1915 approved
  html += `<div class="tt-section"><span class="tt-label">§1915 Waiver:</span> `;
  if (s.waiver1915.approved) {
    html += `${s.waiver1915.name || "Approved"}`;
    if (s.waiver1915.count > 1) html += ` <em>(${s.waiver1915.count} waivers)</em>`;
    const exp = fmtDates(s.waiver1915.dates);
    if (exp) html += `<br><small>${exp}</small>`;
  } else {
    html += `<span class="tt-none">None</span>`;
  }
  html += `</div>`;

  html += `<div class="tt-click-hint">Click to view full state profile →</div>`;
  return html;
}

function showTooltip(evt, abbr) {
  tooltip.innerHTML = buildTooltip(abbr);
  tooltip.style.display = "block";
  moveTooltip(evt);
}

function moveTooltip(evt) {
  const pad = 14;
  const tw = tooltip.offsetWidth;
  const th = tooltip.offsetHeight;
  let x = evt.clientX + pad;
  let y = evt.clientY + pad;
  if (x + tw > window.innerWidth - 10)  x = evt.clientX - tw - pad;
  if (y + th > window.innerHeight - 10) y = evt.clientY - th - pad;
  tooltip.style.left = x + "px";
  tooltip.style.top  = y + "px";
}

function hideTooltip() {
  tooltip.style.display = "none";
}

// ── D3 map render ──────────────────────────────────────────────────────────
const svg = d3.select("#map");
const projection = d3.geoAlbersUsa().scale(1280).translate([487, 300]);
const path = d3.geoPath().projection(projection);

// Stripe pattern for pending states
const defs = svg.append("defs");

// Create stripe pattern for each pending state (reuse single pattern)
defs.append("pattern")
  .attr("id", "pending-stripe")
  .attr("patternUnits", "userSpaceOnUse")
  .attr("width", 8).attr("height", 8)
  .attr("patternTransform", "rotate(45)")
  .append("rect")
    .attr("width", 4).attr("height", 8)
    .attr("fill", "#fd8d3c").attr("opacity", 0.45);

fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json")
  .then(r => r.json())
  .then(us => {
    const states = topojson.feature(us, us.objects.states);

    svg.selectAll(".state-path")
      .data(states.features)
      .enter()
      .append("path")
        .attr("class", "state-path")
        .attr("d", path)
        .attr("fill", d => {
          const abbr = FIPS[d.id.toString().padStart(2,"0")];
          return getColor(abbr);
        })
        .on("mouseover", function(evt, d) {
          const abbr = FIPS[d.id.toString().padStart(2,"0")];
          showTooltip(evt, abbr);
        })
        .on("mousemove", moveTooltip)
        .on("mouseout", hideTooltip)
        .on("click", function(evt, d) {
          const abbr = FIPS[d.id.toString().padStart(2,"0")];
          if (abbr) window.location.href = "state.html?state=" + abbr;
        });

    // Overlay stripes for pending states
    svg.selectAll(".state-pending-overlay")
      .data(states.features.filter(d => {
        const abbr = FIPS[d.id.toString().padStart(2,"0")];
        return hasPending(abbr);
      }))
      .enter()
      .append("path")
        .attr("class", "state-path")
        .attr("d", path)
        .attr("fill", "url(#pending-stripe)")
        .attr("pointer-events", "none");

    // State borders
    svg.append("path")
      .datum(topojson.mesh(us, us.objects.states, (a, b) => a !== b))
      .attr("fill", "none")
      .attr("stroke", "#fff")
      .attr("stroke-width", "0.5px")
      .attr("d", path);

    // ── DC Inset ──────────────────────────────────────────────────────────────
    // DC is too small to see on the main map; render it as a blown-up inset
    // in the bottom-right corner with a leader line back to its real location.
    const dcFeature = states.features.find(d => d.id.toString().padStart(2,"0") === "11");
    if (dcFeature) {
      // DC's real screen position (using known geographic centroid)
      const dcScreen = projection([-77.0369, 38.9072]);

      // Inset box: bottom-right, matching the AK/HI aesthetic
      const ix = 812, iy = 450, iw = 108, ih = 90;
      const iCx = ix + iw / 2;  // inset center-x
      const iTop = iy;           // top edge of inset box

      // Leader line: bezier from DC's real position curving down to inset top
      const cpX = iCx + 10;
      const cpY = dcScreen[1] + (iTop - dcScreen[1]) * 0.45;
      svg.append("path")
        .attr("d", `M ${dcScreen[0]} ${dcScreen[1]} Q ${cpX} ${cpY} ${iCx} ${iTop}`)
        .attr("fill", "none")
        .attr("stroke", "#555")
        .attr("stroke-width", 1.2)
        .attr("stroke-dasharray", "5,3")
        .attr("pointer-events", "none");

      // Small dot marker at DC's real location on the main map
      svg.append("circle")
        .attr("cx", dcScreen[0])
        .attr("cy", dcScreen[1])
        .attr("r", 5)
        .attr("fill", getColor("DC"))
        .attr("stroke", "#fff")
        .attr("stroke-width", 1.5)
        .style("cursor", "pointer")
        .on("mouseover", (evt) => showTooltip(evt, "DC"))
        .on("mousemove", moveTooltip)
        .on("mouseout", hideTooltip)
        .on("click", () => { window.location.href = "state.html?state=DC"; });

      // Stripe overlay on dot if pending
      if (hasPending("DC")) {
        svg.append("circle")
          .attr("cx", dcScreen[0])
          .attr("cy", dcScreen[1])
          .attr("r", 5)
          .attr("fill", "url(#pending-stripe)")
          .attr("pointer-events", "none");
      }

      // Clip path so DC shape stays inside the inset box
      defs.append("clipPath")
        .attr("id", "dc-inset-clip")
        .append("rect")
        .attr("x", ix).attr("y", iy)
        .attr("width", iw).attr("height", ih)
        .attr("rx", 4);

      // Inset background
      svg.append("rect")
        .attr("x", ix).attr("y", iy)
        .attr("width", iw).attr("height", ih)
        .attr("fill", "#eaf3fb")
        .attr("rx", 4)
        .attr("pointer-events", "none");

      // DC shape in inset — zoomed-in Mercator projection
      const dcProjection = d3.geoMercator()
        .center([-77.0369, 38.9072])
        .scale(24000)
        .translate([iCx, iy + ih / 2]);
      const dcPath = d3.geoPath().projection(dcProjection);

      svg.append("path")
        .datum(dcFeature)
        .attr("clip-path", "url(#dc-inset-clip)")
        .attr("d", dcPath)
        .attr("fill", getColor("DC"))
        .attr("stroke", "#fff")
        .attr("stroke-width", 1)
        .style("cursor", "pointer")
        .on("mouseover", (evt) => showTooltip(evt, "DC"))
        .on("mousemove", moveTooltip)
        .on("mouseout", hideTooltip)
        .on("click", () => { window.location.href = "state.html?state=DC"; });

      // Stripe overlay on DC inset shape if pending
      if (hasPending("DC")) {
        svg.append("path")
          .datum(dcFeature)
          .attr("clip-path", "url(#dc-inset-clip)")
          .attr("d", dcPath)
          .attr("fill", "url(#pending-stripe)")
          .attr("pointer-events", "none");
      }

      // Inset border (drawn on top)
      svg.append("rect")
        .attr("x", ix).attr("y", iy)
        .attr("width", iw).attr("height", ih)
        .attr("fill", "none")
        .attr("stroke", "#888")
        .attr("stroke-width", 1)
        .attr("rx", 4)
        .attr("pointer-events", "none");

      // Label below inset
      svg.append("text")
        .attr("x", iCx)
        .attr("y", iy + ih + 14)
        .attr("text-anchor", "middle")
        .attr("font-size", "10.5px")
        .attr("font-family", "Georgia, serif")
        .attr("fill", "#333")
        .text("Washington, D.C.");
    }
  })
  .catch(err => {
    document.getElementById("map-container").innerHTML =
      `<p style="padding:2rem;color:#c00">Map failed to load. Please check your internet connection.<br><small>${err}</small></p>`;
  });
</script>
</body>
</html>
