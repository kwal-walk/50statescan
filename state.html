<script>
const params = new URLSearchParams(window.location.search);
const abbr = (params.get("state") || "").toUpperCase();
const from  = params.get("from") || "1115";
const s = STATE_DATA[abbr];
const container = document.getElementById("state-content");

const backMap = {
  "1115": ["map-1115.html", "§1115 Waivers Map"],
  "1915": ["map-1915.html", "§1915 Waivers Map"],
  "ilos": ["map-ilos.html", "ILOS Map"],
  "list": ["states-list.html", "States List"]
};
const [backHref, backLabel] = backMap[from] || backMap["1115"];

// ── Helpers ───────────────────────────────────────────────────────────────────

function esc(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escAttr(str) {
  return String(str).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}

function parseDates(datesStr) {
  const labels = ["Approval","Effective","Expiration"];
  let parts = [];
  for (const label of labels) {
    const m = datesStr.match(new RegExp(label + ":\\s*([^\\n]+)"));
    if (m) parts.push(`${label}: ${m[1].trim()}`);
  }
  return parts.length ? parts.join("  ·  ") : esc(datesStr);
}

// Shorten a URL to a readable label
function getUrlTitle(url) {
  try {
    const u = new URL(url.trim());
    const host = u.hostname.replace(/^www\./, "");
    const skip = new Set(["download","downloads","media","inline","index.html","index.htm"]);
    const parts = u.pathname.split("/").filter(p => p && !skip.has(p.toLowerCase()) && !/^\d{4,}$/.test(p));
    if (parts.length >= 1) {
      let slug = parts[parts.length - 1]
        .replace(/\.(html?|pdf|php|aspx?)$/i, "")
        .replace(/^([a-z]{2})-/i, (_, st) => st.toUpperCase() + " ") // state-code prefix
        .replace(/-\d{6,}(\.\w+)?$/, "")   // trailing date stamp
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
      if (!slug || slug.length <= 2) {
        if (parts.length >= 2) slug = parts[parts.length - 2].replace(/[-_]/g," ").replace(/\b\w/g, c=>c.toUpperCase());
      }
      if (slug.length > 44) slug = slug.slice(0, 41) + "…";
      if (slug && slug.length > 2) return `${host}: ${slug}`;
    }
    return host;
  } catch (e) {
    return url.length > 55 ? url.slice(0, 52) + "…" : url;
  }
}

// Convert text with URLs (possibly in "Label - https://..." format) to HTML links
function linkifyText(text) {
  if (!text) return "";
  return text.split(/\n/).map(line => {
    // "Label text - https://url" → the label becomes the link text
    const lm = line.match(/^(.+?)\s+-\s+(https?:\/\/\S+)\s*$/);
    if (lm) {
      const url = lm[2].replace(/[.,;)]+$/, "");
      return `<a href="${escAttr(url)}" target="_blank" rel="noopener">${esc(lm[1].trim())}</a>`;
    }
    // Otherwise replace bare URLs with short links
    return line.split(/(https?:\/\/[^\s]+)/).map((p, i) => {
      if (i % 2 === 1) {
        const url = p.replace(/[.,;)]+$/, "");
        return `<a href="${escAttr(url)}" target="_blank" rel="noopener">${esc(getUrlTitle(url))}</a>`;
      }
      return esc(p);
    }).join("");
  }).join("<br>");
}

// Bold nutrition-related keywords (operates on already-escaped HTML)
function boldKw(html) {
  const kwRe = new RegExp(
    "\\b(nutrition(?:al|ist|s)?|meals?|pantry|pantries|diet(?:ary)?|foods?|grocer(?:y|ies)|produce|" +
    "medically tailored|medically supportive|home[- ]delivered|cooking|culinary|" +
    "fruits?|vegetables?|calori(?:e|es|c)|hunger|hungry|snack(?:s)?)\\b", "gi"
  );
  // Only replace inside text nodes, not inside HTML tags
  return html.replace(/(<[^>]*>)|([^<]+)/g, (match, tag, text) => {
    if (tag) return tag;
    return text.replace(kwRe, '<span class="kw-bold">$1</span>');
  });
}

// Known section header names in 1115 waiver text
const HEADER_RE = /^(Eligibility|Services?|Duration|Covered Services?|Target Population|Population|Description|Benefits?|Overview|Background|Requirements?|Coverage|Nutrition Services?|Goals?|Objectives?)$/i;

// Build the "Sources" div from extracted source lines
function buildSourceHtml(srcLines) {
  const allText = srcLines.map(l => l.trim()).join(" ");
  const found = allText.match(/https?:\/\/[^\s,]+/g) || [];
  const urls = found.map(u => u.replace(/[.,;)]+$/, ""));

  let h = `<div class="d-sources">`;
  h += `<div class="d-sources-note">Text reproduced directly from referenced source(s).</div>`;
  if (urls.length > 0) {
    const links = urls.map(u =>
      `<a href="${escAttr(u)}" target="_blank" rel="noopener">${esc(getUrlTitle(u))}</a>`
    );
    h += `<strong>Source${urls.length !== 1 ? "s" : ""}:</strong> ${links.join(" &nbsp;·&nbsp; ")}`;
  } else {
    const clean = allText.replace(/^source[-:\s]*/i, "").trim();
    if (clean) h += `<strong>Source:</strong> ${esc(clean)}`;
  }
  h += `</div>`;
  return h;
}

// Parse raw waiver detail text → clean HTML with proper lists, headers, sources
function formatDetails(rawText) {
  if (!rawText) return "";

  const lines = rawText.split(/\r?\n/);
  let srcLines = [], bodyLines = [], inSrc = false;
  for (const line of lines) {
    if (!inSrc && /^source/i.test(line.trim())) inSrc = true;
    if (inSrc) srcLines.push(line);
    else bodyLines.push(line);
  }

  let html = "";
  let cur = null; // current open list: { type, items }

  function flushList() {
    if (!cur) return;
    const isUl = cur.type === "ul" || cur.type === "ul2";
    const TAG  = isUl ? "ul" : "ol";
    const CLS  = { ul:"d-ul", ul2:"d-ul-2", ol:"d-ol", "ol-roman":"d-ol roman", ol2:"d-ol sub" }[cur.type] || "d-ol";
    html += `<${TAG} class="${CLS}">${cur.items}</${TAG}>`;
    cur = null;
  }

  function addItem(type, text) {
    if (cur && cur.type === type) { cur.items += `<li>${text}</li>`; }
    else { flushList(); cur = { type, items: `<li>${text}</li>` }; }
  }

  for (const rawLine of bodyLines) {
    const trimmed = rawLine.trim();
    // Strip surrounding quote chars the user added for plagiarism avoidance
    let line = trimmed.replace(/^"+/, "").replace(/"+$/, "").trim();
    if (!line) continue;

    const leadSpaces = (rawLine.match(/^(\s*)/) || ["",""])[1].length;
    const isIndented = leadSpaces >= 3;

    // Bullet prefix: -, –, •, *, ·
    const bm = line.match(/^[•\-–\*·]\s+([\s\S]*)/);
    // 'o ' sub-bullet (common in CMS documents)
    const om = isIndented && line.match(/^o\s+([\s\S]*)/);
    const hasBullet = !!(bm || om);

    // Content after stripping bullet prefix + inner quotes
    let content = line;
    if      (bm) content = bm[1].trim().replace(/^"+/, "").replace(/"+$/, "").trim();
    else if (om) content = om[1].trim().replace(/^"+/, "").replace(/"+$/, "").trim();

    // Roman numeral at start of content: i. ii. iii. iv. v. vi. vii. viii. ix. x. xi. xii.
    const rmM = content.match(/^([ivx]{1,5})\.\s+([\s\S]+)/i);
    const isRoman = rmM && /^(i{1,3}|iv|v|vi{0,3}|ix|x{1,2}|xi{0,2}|xii|xiv|xv)$/i.test(rmM[1]);

    // Numbered: 1. 2. etc.
    const nmM = content.match(/^(\d+)\.\s+([\s\S]+)/);

    // Lettered sub-item: (A) (B) etc.
    const ltM = isIndented && line.match(/^\([A-Za-z]\)\s+([\s\S]+)/);

    if (isRoman) {
      addItem("ol-roman", esc(rmM[2].trim()));
    } else if (ltM) {
      addItem("ol2", esc(ltM[1].trim()));
    } else if (nmM && isIndented) {
      addItem("ol2", esc(nmM[2].trim()));
    } else if (nmM) {
      addItem("ol", esc(nmM[2].trim()));
    } else if (hasBullet) {
      addItem(isIndented ? "ul2" : "ul", esc(content));
    } else if (isIndented) {
      // Indented plain text → sub-bullet
      addItem("ul2", esc(line));
    } else {
      flushList();
      if (HEADER_RE.test(line)) {
        html += `<p class="d-head">${esc(line)}</p>`;
      } else {
        html += `<p class="d-p">${esc(line)}</p>`;
      }
    }
  }

  flushList();
  if (srcLines.length > 0) html += buildSourceHtml(srcLines);
  return boldKw(html);
}

// ── Page render ───────────────────────────────────────────────────────────────

if (!s) {
  container.innerHTML = `
    <div class="state-page-header">
      <div class="state-page-inner">
        <a class="state-back" href="${backHref}">← ${backLabel}</a>
        <h1>State not found</h1>
      </div>
    </div>
    <div class="state-page-content">
      <div class="no-waiver-card">State not found. <a href="index.html">Return to home.</a></div>
    </div>`;
} else {
  document.title = `${s.name} — Medicaid Nutrition Waivers`;

  const has1115    = s.waiver1115.approved;
  const hasPending = s.waiver1115pending.pending;
  const has1915    = s.waiver1915.approved;
  const ilosStatus = s.ilos.status;

  // Build badges
  let badges = "";
  if (has1115)    badges += `<span class="s-badge b1115">§1115 Approved</span>`;
  if (hasPending) badges += `<span class="s-badge bpending">§1115 Pending</span>`;
  if (has1915)    badges += `<span class="s-badge b1915">§1915 Approved</span>`;
  if (ilosStatus === "yes") badges += `<span class="s-badge bilos">ILOS Identified</span>`;
  if (!has1115 && !hasPending && !has1915 && ilosStatus !== "yes")
    badges += `<span class="s-badge bnone">No waivers identified</span>`;

  let html = `
    <div class="state-page-header">
      <div class="state-page-inner">
        <a class="state-back" href="${backHref}">← ${backLabel}</a>
        <h1>${s.name}</h1>
        <div class="state-badges">${badges}</div>
      </div>
    </div>
    <div class="state-page-content">`;

  // ── §1115 Section ──────────────────────────────────────────────────────────
  html += `
    <div class="sp-section">
      <div class="sp-section-head">
        <div class="sp-dot d1115"></div>
        <h2>§1115 Demonstration Waiver</h2>
      </div>`;

  if (has1115) {
    const w = s.waiver1115;
    html += `<div class="waiver-block">`;
    if (w.name) html += `<h3>${esc(w.name)}</h3>`;
    if (w.count > 1) html += `<p style="font-size:0.82rem;color:var(--muted);margin-bottom:0.5rem;">${w.count} §1115 waivers identified for this state.</p>`;
    if (w.dates) html += `<div class="waiver-dates">${parseDates(w.dates)}</div>`;
    if (w.details) html += `<div class="waiver-details">${formatDetails(w.details)}</div>`;
    html += `</div>`;
  } else {
    html += `<div class="no-waiver-card">No approved §1115 nutrition waiver identified for ${s.name}.</div>`;
  }
  html += `</div>`;

  // ── §1115 Pending Section ──────────────────────────────────────────────────
  if (hasPending) {
    const p = s.waiver1115pending;
    html += `
    <div class="sp-section">
      <div class="sp-section-head">
        <div class="sp-dot d1115p"></div>
        <h2>§1115 Pending Waiver</h2>
      </div>
      <div class="waiver-block">`;
    if (p.name) html += `<h3>${esc(p.name)}</h3>`;
    if (p.submitted) html += `<div class="waiver-dates">Submitted: ${esc(p.submitted)}</div>`;
    if (p.details) html += `<div class="waiver-details">${formatDetails(p.details)}</div>`;
    html += `</div></div>`;
  }

  // ── §1915 Section ──────────────────────────────────────────────────────────
  html += `
    <div class="sp-section">
      <div class="sp-section-head">
        <div class="sp-dot d1915"></div>
        <h2>§1915 Home &amp; Community-Based Services Waivers</h2>
      </div>`;

  if (has1915 && s.waiver1915.waivers.length > 0) {
    s.waiver1915.waivers.forEach(w => {
      html += `<div class="waiver-block">`;
      if (w.name) html += `<h3>${esc(w.name)}</h3>`;
      if (w.dates) html += `<div class="waiver-dates">${parseDates(w.dates)}</div>`;
      if (w.details) html += `<div class="waiver-details">${formatDetails(w.details)}</div>`;
      html += `</div>`;
    });
  } else {
    html += `<div class="no-waiver-card">No approved §1915 nutrition waiver identified for ${s.name}.</div>`;
  }
  html += `</div>`;

  // ── ILOS Section ───────────────────────────────────────────────────────────
  html += `
    <div class="sp-section">
      <div class="sp-section-head">
        <div class="sp-dot dilos"></div>
        <h2>In Lieu of Services and Settings (ILOS)</h2>
      </div>`;

  if (ilosStatus === "na") {
    html += `<div class="no-waiver-card">N/A — ${s.name} does not have Medicaid managed care and therefore does not use ILOS.</div>`;
  } else if (ilosStatus === "yes") {
    html += `<div class="waiver-block">`;
    if (s.ilos.services) {
      html += `<h3>Nutrition-Related ILOS Services</h3>`;
      html += `<div class="waiver-details">${formatDetails(s.ilos.services)}</div>`;
    }
    const hasLinks = s.ilos.links_garfield || s.ilos.links_add || s.ilos.literature;
    if (hasLinks) {
      html += `<div class="d-sources">`;
      html += `<div class="d-sources-note">Text reproduced directly from referenced source(s).</div>`;
      if (s.ilos.links_garfield) html += `<p style="margin-bottom:0.4rem;"><strong>Government sources:</strong><br>${linkifyText(s.ilos.links_garfield)}</p>`;
      if (s.ilos.links_add) html += `<p style="margin-bottom:0.4rem;"><strong>Additional sources:</strong><br>${linkifyText(s.ilos.links_add)}</p>`;
      if (s.ilos.literature) html += `<p><strong>Published literature:</strong><br>${linkifyText(s.ilos.literature)}</p>`;
      html += `</div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="no-waiver-card">No ILOS for nutrition services identified for ${s.name}.</div>`;
  }
  html += `</div>`;

  html += `</div>`; // close state-page-content

  // ── Prev / next state navigation ──────────────────────────────────────────
  const navEntries = Object.entries(STATE_DATA)
    .sort((a, b) => a[1].name.localeCompare(b[1].name));
  const navIdx = navEntries.findIndex(([a]) => a === abbr);
  const prevE  = navIdx > 0                       ? navEntries[navIdx - 1] : null;
  const nextE  = navIdx < navEntries.length - 1   ? navEntries[navIdx + 1] : null;

  html += `<div class="state-nav-bar">`;
  html += prevE
    ? `<a class="state-nav-arrow state-nav-prev" href="state.html?state=${prevE[0]}&from=${from}" data-tip="${escAttr(prevE[1].name)}">&#8592;</a>`
    : `<span></span>`;
  html += nextE
    ? `<a class="state-nav-arrow state-nav-next" href="state.html?state=${nextE[0]}&from=${from}" data-tip="${escAttr(nextE[1].name)}">&#8594;</a>`
    : `<span></span>`;
  html += `</div>`;

  container.innerHTML = html;
}
</script>
<script src="nav.js"></script>
</body>
